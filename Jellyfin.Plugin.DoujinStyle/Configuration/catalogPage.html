<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <title>Catalogue DoujinStyle</title>
</head>
<body>
<div id="DoujinStyleCatalogPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-input">
    <style>
        .ds-wrap { max-width: 1400px; margin: 0 auto; padding-bottom: 48px; }
        .ds-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
        .ds-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
        .ds-search-box { flex: 1; min-width: 220px; display: flex; gap: 8px; align-items: center; }
        .ds-search-input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.16); background: rgba(0,0,0,0.3); color: inherit; font-size: 0.95em; }
        .ds-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 18px; scrollbar-width: thin; }
        .ds-chip {
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(255,255,255,0.06);
            color: inherit;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.18s ease;
        }
        .ds-chip:hover { background: rgba(168,85,247,0.22); border-color: rgba(168,85,247,0.6); }
        .ds-chip.active { background: #9333ea; border-color: #a855f7; color: #fff; box-shadow: 0 2px 10px rgba(147,51,234,0.4); }
        .ds-flac-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); cursor: pointer; user-select: none; font-size: 0.9em; }
        .ds-flac-toggle.active { background: rgba(16,185,129,0.22); border-color: #10b981; color: #6ee7b7; }
        .ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 18px; }
        .ds-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.18s ease, border-color 0.18s ease;
        }
        .ds-card:hover { transform: translateY(-3px); border-color: rgba(168,85,247,0.55); }
        .ds-cover-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #18181b; cursor: pointer; overflow: hidden; }
        .ds-cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ds-card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; gap: 10px; }
        .ds-card-title { font-weight: 600; font-size: 0.98em; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
        .ds-card-artist { font-size: 0.86em; opacity: 0.78; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ds-card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .ds-tag { font-size: 0.72em; padding: 2px 7px; border-radius: 4px; background: rgba(168,85,247,0.18); color: #e9d5ff; }
        .ds-dl-btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 9px 12px;
            font-weight: 600;
            font-size: 0.88em;
            cursor: pointer;
            background: #7e22ce;
            color: #fff;
            transition: background 0.15s ease;
        }
        .ds-dl-btn:hover { background: #9333ea; }
        .ds-dl-btn.done { background: rgba(34,197,94,0.22); color: #86efac; border: 1px solid rgba(34,197,94,0.5); }
        .ds-dl-btn.busy { background: rgba(168,85,247,0.25); color: #e9d5ff; cursor: default; }
        .ds-pager { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 26px; }
        .ds-queue-box { margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; background: rgba(168,85,247,0.12); border: 1px solid rgba(168,85,247,0.35); display: none; }
        .ds-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 16px; }
        .ds-modal { background: #181824; border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; max-width: 680px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px; color: #f8fafc; }
    </style>

    <div data-role="content">
        <div class="content-primary ds-wrap">
            <div class="ds-header">
                <div>
                    <h2 class="sectionTitle" style="margin-bottom:4px;">Catalogue DoujinStyle</h2>
                    <div style="opacity:0.78; font-size:0.92em;">Parcourez tous les albums par nouveautés, hasard ou genre et importez-les en 1 clic dans votre Jellyfin.</div>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <a is="emby-linkbutton" class="raised button-alt" href="configurationpage?name=DoujinStyleImporter" style="padding:8px 14px; border-radius:6px; text-decoration:none;">
                        <span>⚙️ Paramètres &amp; File d'attente</span>
                    </a>
                </div>
            </div>

            <div id="dsActiveQueueBanner" class="ds-queue-box">
                <div style="font-weight:600; margin-bottom:6px;">Téléchargements actifs</div>
                <div id="dsActiveQueueList"></div>
            </div>

            <div class="ds-toolbar">
                <div class="ds-search-box">
                    <input id="dsCatalogSearchInput" class="ds-search-input" type="text" placeholder="Filtrer ou chercher un artiste / album (optionnel)..." />
                    <button is="emby-button" type="button" id="btnCatalogSearch" class="raised button-submit" style="margin:0;">
                        <span>Chercher</span>
                    </button>
                    <button is="emby-button" type="button" id="btnCatalogClearSearch" class="raised" style="margin:0; display:none;">
                        <span>Effacer</span>
                    </button>
                </div>
                <div id="btnFlacToggle" class="ds-flac-toggle" title="Afficher uniquement les albums FLAC">
                    <span>💎 FLAC uniquement</span>
                </div>
            </div>

            <div id="dsCategoryChips" class="ds-chips"></div>

            <div id="dsCatalogError" style="display:none; padding:14px; border-radius:8px; background:rgba(239,68,68,0.18); border:1px solid #ef4444; color:#fecaca; margin-bottom:16px;"></div>

            <div id="dsAlbumGrid" class="ds-grid"></div>

            <div id="dsPager" class="ds-pager">
                <button is="emby-button" type="button" id="btnPrevPage" class="raised">
                    <span>← Page précédente</span>
                </button>
                <span id="dsPageIndicator" style="font-weight:600;">Page 1</span>
                <button is="emby-button" type="button" id="btnNextPage" class="raised button-submit">
                    <span>Page suivante →</span>
                </button>
            </div>
        </div>
    </div>

    <div id="dsDetailModalBackdrop" class="ds-modal-backdrop">
        <div class="ds-modal">
            <div id="dsDetailModalContent"></div>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            var categories = [
                { key: 'recent', label: '🆕 Nouveautés' },
                { key: 'random', label: '🎲 Aléatoire (Relancer)' },
                { key: 'Touhou', label: '⛩️ Touhou Project' },
                { key: 'Vocaloid', label: '🎤 Vocaloid' },
                { key: 'Hardcore', label: '⚡ Hardcore / J-Core' },
                { key: 'Trance', label: '🌌 Trance / EDM' },
                { key: 'Eurobeat', label: '🏎️ Eurobeat' },
                { key: 'Rock', label: '🎸 Rock / Metal' },
                { key: 'Orchestral', label: '🎹 Piano / Jazz / Orchestral' },
                { key: 'Original', label: '✨ Créations Originales' }
            ];

            var state = {
                category: 'recent',
                page: 0,
                onlyFlac: false,
                searchQuery: '',
                items: [],
                jobsById: {}
            };
            var pollTimer = null;

            function escapeHtml(str) {
                var div = document.createElement('div');
                div.textContent = str || '';
                return div.innerHTML;
            }

            function apiFetchJson(path, options) {
                var opts = options || {};
                opts.headers = Object.assign({
                    'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"'
                }, opts.headers || {});
                return fetch(ApiClient.getUrl(path), opts).then(function (r) { return r.json(); });
            }

            function getCoverProxyUrl(albumGuid) {
                return ApiClient.getUrl('Items/' + albumGuid + '/Images/Primary', {
                    api_key: ApiClient.accessToken()
                });
            }

            function renderChips() {
                var bar = document.getElementById('dsCategoryChips');
                bar.innerHTML = categories.map(function (c) {
                    var active = !state.searchQuery && state.category === c.key ? ' active' : '';
                    return '<button type="button" class="ds-chip' + active + '" data-cat="' + escapeHtml(c.key) + '">' +
                        escapeHtml(c.label) + '</button>';
                }).join('');

                Array.prototype.forEach.call(bar.querySelectorAll('.ds-chip'), function (btn) {
                    btn.addEventListener('click', function () {
                        var chosen = btn.getAttribute('data-cat');
                        state.searchQuery = '';
                        document.getElementById('dsCatalogSearchInput').value = '';
                        document.getElementById('btnCatalogClearSearch').style.display = 'none';
                        if (state.category === chosen && chosen === 'random') {
                            loadCatalog(true);
                            return;
                        }
                        state.category = chosen;
                        state.page = 0;
                        renderChips();
                        loadCatalog(chosen === 'random');
                    });
                });
            }

            function buildButtonState(albumId, inlineJob) {
                var job = state.jobsById[albumId] || inlineJob;
                if (!job) {
                    return { cls: 'ds-dl-btn', text: '⬇ Télécharger', disabled: false };
                }
                var st = job.Status;
                if (st === 'Completed' || st === 5) {
                    return { cls: 'ds-dl-btn done', text: '✓ Importé dans Jellyfin', disabled: false };
                }
                if (st === 'Failed' || st === 6) {
                    return { cls: 'ds-dl-btn', text: '⚠ Réessayer', disabled: false };
                }
                return { cls: 'ds-dl-btn busy', text: '⏳ ' + (job.ProgressPercent || 0) + '% en cours...', disabled: true };
            }

            function renderGrid() {
                var grid = document.getElementById('dsAlbumGrid');
                if (!state.items || state.items.length === 0) {
                    grid.innerHTML = '<div style="grid-column:1/-1; padding:32px; text-align:center; opacity:0.75;">Aucun album trouvé sur cette page.</div>';
                    return;
                }

                grid.innerHTML = state.items.map(function (item) {
                    var tags = (item.Tags || []).slice(0, 3).map(function (t) {
                        return '<span class="ds-tag">' + escapeHtml(t) + '</span>';
                    }).join('');
                    var btnInfo = buildButtonState(item.Id, item.Job);
                    var coverSrc = getCoverProxyUrl(item.AlbumGuid);

                    return '<div class="ds-card">' +
                        '<div class="ds-cover-wrap" onclick="window.dsOpenAlbumModal(\'' + escapeHtml(item.Id) + '\')">' +
                            '<img loading="lazy" src="' + escapeHtml(coverSrc) + '" alt="' + escapeHtml(item.Title) + '" />' +
                        '</div>' +
                        '<div class="ds-card-body">' +
                            '<div>' +
                                '<div class="ds-card-title" title="' + escapeHtml(item.Title) + '" onclick="window.dsOpenAlbumModal(\'' + escapeHtml(item.Id) + '\')">' + escapeHtml(item.Title) + '</div>' +
                                '<div class="ds-card-artist" title="' + escapeHtml(item.Artist) + '">' + escapeHtml(item.Artist) + '</div>' +
                                (tags ? '<div class="ds-card-tags">' + tags + '</div>' : '') +
                            '</div>' +
                            '<button type="button" class="' + btnInfo.cls + '" data-dl-id="' + escapeHtml(item.Id) + '" ' +
                                (btnInfo.disabled ? 'disabled' : '') +
                                ' onclick="window.dsCatalogDownload(\'' + escapeHtml(item.Id) + '\')">' +
                                escapeHtml(btnInfo.text) +
                            '</button>' +
                        '</div>' +
                    '</div>';
                }).join('');
            }

            function updatePager() {
                var pager = document.getElementById('dsPager');
                if (state.searchQuery || state.category === 'random') {
                    pager.style.display = state.category === 'random' ? 'flex' : 'none';
                    document.getElementById('btnPrevPage').style.display = 'none';
                    document.getElementById('dsPageIndicator').textContent = state.category === 'random' ? 'Sélection aléatoire' : '';
                    document.getElementById('btnNextPage').querySelector('span').textContent = '🎲 Nouveaux albums au hasard';
                    return;
                }
                pager.style.display = 'flex';
                document.getElementById('btnPrevPage').style.display = state.page > 0 ? 'inline-flex' : 'none';
                document.getElementById('dsPageIndicator').textContent = 'Page ' + (state.page + 1);
                document.getElementById('btnNextPage').querySelector('span').textContent = 'Page suivante →';
            }

            function loadCatalog(forceRefresh) {
                var grid = document.getElementById('dsAlbumGrid');
                var errBox = document.getElementById('dsCatalogError');
                errBox.style.display = 'none';
                grid.innerHTML = '<div style="grid-column:1/-1; padding:40px; text-align:center;">Chargement des albums DoujinStyle...</div>';
                updatePager();

                var url = state.searchQuery
                    ? 'DoujinStyle/Search?query=' + encodeURIComponent(state.searchQuery)
                    : 'DoujinStyle/Browse?category=' + encodeURIComponent(state.category) +
                      '&page=' + state.page +
                      '&onlyFlac=' + (state.onlyFlac ? 'true' : 'false') +
                      '&refresh=' + (forceRefresh ? 'true' : 'false');

                apiFetchJson(url).then(function (res) {
                    if (!res.Success) {
                        errBox.style.display = 'block';
                        errBox.textContent = res.Error || 'Impossible de charger DoujinStyle.';
                        grid.innerHTML = '';
                        return;
                    }
                    state.items = res.Items || [];
                    renderGrid();
                }).catch(function (err) {
                    errBox.style.display = 'block';
                    errBox.textContent = 'Erreur réseau : ' + err;
                    grid.innerHTML = '';
                });
            }

            function pollJobs() {
                apiFetchJson('DoujinStyle/Jobs').then(function (jobs) {
                    var map = {};
                    var active = [];
                    (jobs || []).forEach(function (j) {
                        map[j.AlbumId] = j;
                        if (j.Status !== 5 && j.Status !== 6 && j.Status !== 'Completed' && j.Status !== 'Failed') {
                            active.push(j);
                        }
                    });
                    state.jobsById = map;

                    var banner = document.getElementById('dsActiveQueueBanner');
                    var listEl = document.getElementById('dsActiveQueueList');
                    if (active.length > 0) {
                        banner.style.display = 'block';
                        listEl.innerHTML = active.map(function (a) {
                            return '<div style="font-size:0.9em; margin-top:4px;">' +
                                '<strong>' + escapeHtml(a.Artist + ' — ' + a.AlbumTitle) + '</strong> : ' +
                                escapeHtml(a.StatusMessage || '') + ' (' + (a.ProgressPercent || 0) + '%)' +
                            '</div>';
                        }).join('');
                    } else {
                        banner.style.display = 'none';
                    }

                    // Refresh button labels in-place without flickering images
                    Array.prototype.forEach.call(document.querySelectorAll('[data-dl-id]'), function (btn) {
                        var id = btn.getAttribute('data-dl-id');
                        var b = buildButtonState(id, null);
                        btn.className = b.cls;
                        btn.textContent = b.text;
                        btn.disabled = b.disabled;
                    });
                }).catch(function () {});
            }

            window.dsCatalogDownload = function (albumId) {
                state.jobsById[albumId] = { Status: 'Queued', ProgressPercent: 0 };
                pollJobs();
                apiFetchJson('DoujinStyle/Download/' + encodeURIComponent(albumId), { method: 'POST' })
                    .then(function (job) {
                        state.jobsById[albumId] = job;
                        pollJobs();
                    })
                    .catch(function (err) {
                        Dashboard.alert('Erreur : ' + err);
                    });
            };

            window.dsCloseAlbumModal = function () {
                document.getElementById('dsDetailModalBackdrop').style.display = 'none';
            };

            window.dsOpenAlbumModal = function (albumId) {
                var backdrop = document.getElementById('dsDetailModalBackdrop');
                var content = document.getElementById('dsDetailModalContent');
                backdrop.style.display = 'flex';
                content.innerHTML = '<div style="padding:24px; text-align:center;">Chargement des détails de l\'album...</div>';

                apiFetchJson('DoujinStyle/Album/' + encodeURIComponent(albumId)).then(function (res) {
                    if (!res.Success || !res.Album) {
                        content.innerHTML = '<p style="color:#f87171;">' + escapeHtml(res.Error || 'Introuvable') + '</p>' +
                            '<button type="button" class="ds-dl-btn" onclick="window.dsCloseAlbumModal()">Fermer</button>';
                        return;
                    }
                    var a = res.Album;
                    var btnInfo = buildButtonState(a.Id, a.Job);
                    var tracksHtml = (a.Tracks && a.Tracks.length > 0)
                        ? '<div style="margin-top:14px;"><strong>Pistes :</strong><ol style="margin:6px 0 0 18px; opacity:0.9; font-size:0.9em;">' +
                            a.Tracks.map(function (t) { return '<li style="margin-bottom:3px;">' + escapeHtml(t) + '</li>'; }).join('') +
                          '</ol></div>'
                        : '';
                    var tagsHtml = (a.Tags && a.Tags.length > 0)
                        ? '<div class="ds-card-tags" style="margin-top:10px;">' +
                            a.Tags.map(function (t) { return '<span class="ds-tag">' + escapeHtml(t) + '</span>'; }).join('') +
                          '</div>'
                        : '';

                    content.innerHTML =
                        '<div style="display:flex; gap:18px; flex-wrap:wrap;">' +
                            '<img src="' + escapeHtml(getCoverProxyUrl(a.AlbumGuid)) + '" style="width:180px; height:180px; object-fit:cover; border-radius:10px; background:#111;" />' +
                            '<div style="flex:1; min-width:220px;">' +
                                '<h3 style="margin:0 0 6px 0;">' + escapeHtml(a.Title) + '</h3>' +
                                '<div style="font-size:1.05em; opacity:0.9;">' + escapeHtml(a.Artist) + '</div>' +
                                (a.Format ? '<div style="margin-top:8px; font-size:0.9em;"><strong>Format :</strong> ' + escapeHtml(a.Format) + '</div>' : '') +
                                (a.DateAdded ? '<div style="margin-top:4px; font-size:0.9em;"><strong>Ajouté :</strong> ' + escapeHtml(a.DateAdded) + '</div>' : '') +
                                tagsHtml +
                            '</div>' +
                        '</div>' +
                        tracksHtml +
                        '<div style="display:flex; gap:10px; margin-top:20px;">' +
                            '<button type="button" class="' + btnInfo.cls + '" data-dl-id="' + escapeHtml(a.Id) + '" style="flex:1;" onclick="window.dsCatalogDownload(\'' + escapeHtml(a.Id) + '\')">' +
                                escapeHtml(btnInfo.text) +
                            '</button>' +
                            '<button type="button" class="ds-chip" onclick="window.dsCloseAlbumModal()">Fermer</button>' +
                        '</div>';
                });
            };

            document.getElementById('dsDetailModalBackdrop').addEventListener('click', function (e) {
                if (e.target === this) window.dsCloseAlbumModal();
            });

            document.getElementById('btnFlacToggle').addEventListener('click', function () {
                state.onlyFlac = !state.onlyFlac;
                this.classList.toggle('active', state.onlyFlac);
                state.page = 0;
                loadCatalog(false);
            });

            document.getElementById('btnPrevPage').addEventListener('click', function () {
                if (state.page > 0) {
                    state.page--;
                    loadCatalog(false);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            document.getElementById('btnNextPage').addEventListener('click', function () {
                if (state.category === 'random') {
                    loadCatalog(true);
                } else {
                    state.page++;
                    loadCatalog(false);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            function triggerSearch() {
                var q = document.getElementById('dsCatalogSearchInput').value.trim();
                state.searchQuery = q;
                document.getElementById('btnCatalogClearSearch').style.display = q ? 'inline-flex' : 'none';
                renderChips();
                loadCatalog(false);
            }

            document.getElementById('btnCatalogSearch').addEventListener('click', triggerSearch);
            document.getElementById('dsCatalogSearchInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    triggerSearch();
                }
            });

            document.getElementById('btnCatalogClearSearch').addEventListener('click', function () {
                document.getElementById('dsCatalogSearchInput').value = '';
                state.searchQuery = '';
                this.style.display = 'none';
                renderChips();
                loadCatalog(false);
            });

            document.getElementById('DoujinStyleCatalogPage').addEventListener('pageshow', function () {
                renderChips();
                loadCatalog(false);
                pollJobs();
                if (pollTimer) clearInterval(pollTimer);
                pollTimer = setInterval(pollJobs, 3500);
            });

            document.getElementById('DoujinStyleCatalogPage').addEventListener('pagehide', function () {
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
            });
        })();
    </script>
</div>
</body>
</html>
