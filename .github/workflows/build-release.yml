name: Build & Test Jellyfin Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Run Unit Tests
        run: dotnet test Jellyfin.Plugin.DoujinStyle.sln -c Release --verbosity normal

      - name: Package Plugin Zip & Manifest
        run: bash scripts/package-plugin.sh

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.DoujinStyle
          path: |
            releases/Jellyfin.Plugin.DoujinStyle_*.zip
            releases/manifest.json
            releases/meta.json

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/Jellyfin.Plugin.DoujinStyle_*.zip
            releases/manifest.json
            releases/meta.json
